<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>Reset Password</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6fb;font-family:Arial,Helvetica,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">
        Reset Password Otp {otp}.
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f6fb;">
        <tr>
            <td align="center" style="padding:24px 12px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background-color:#ffffff;border:1px solid #e7eaf0;border-radius:12px;">
                    <tr>
                        <td align="center" style="padding:28px 24px 12px 24px;">
                            <img src="{logo_url}"
                                 alt="Afrimine"
                                 width="160"
                                 border="0"
                                 style="display:block;width:160px;max-width:160px;height:auto;border:0;outline:none;text-decoration:none;" />
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:8px 24px 0 24px;color:#101828;">
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:12px 24px 0 24px;color:#475467;font-size:16px;line-height:24px;">
                            Use the one-time code below to reset your password.
                            Note, Otp expires in 5 minutes.
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding:24px;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="background-color:#f2f4f7;border:1px solid #d0d5dd;border-radius:10px;">
                                <tr>
                                    <td align="center"
                                        style="padding:14px 22px;color:#0b1220;font-size:34px;line-height:40px;font-weight:700;letter-spacing:6px;">
                                        {otp}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:0 24px 24px 24px;color:#475467;font-size:14px;line-height:22px;">
                            If you did not request this code, you can safely ignore this email.
                        </td>
                    </tr>
                </table>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
                    <tr>
                        <td align="center" style="padding:14px 20px 0 20px;color:#98a2b3;font-size:12px;line-height:18px;">
                            © Afrimine {year}. All rights reserved.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
